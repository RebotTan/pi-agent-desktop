name: Build Linux RPM (no updater)

# Builds deb+rpm without needing updater signing secrets.
# The release workflow (release.yml) requires TAURI_SIGNING_PRIVATE_KEY /
# TAURI_UPDATER_PUBLIC_KEY, which forks do not have. This workflow overrides
# createUpdaterArtifacts=false so a plain `tauri build --bundles deb,rpm` runs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/tauri*.json'
      - '.github/workflows/rpm-build.yml'

permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out pid
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            rpm

      - name: Install dependencies
        run: npm ci

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Build deb and rpm bundles
        run: npm run desktop:build -- --bundles deb,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error